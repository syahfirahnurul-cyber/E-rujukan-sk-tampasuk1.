  <style>
    :root {
      /* Malaysian Counseling Purple Palette */
      --primary-950: #2e1065;
      --primary-900: #3b0764;
      --primary-800: #581c87;
      --primary-700: #6b21a8;
      --primary-600: #7e22ce;
      --primary-500: #9333ea;
      --primary-400: #a855f7;
      --primary-300: #c084fc;
      --primary-200: #e9d5ff;
      --primary-100: #f3e8ff;
      --primary-50: #faf5ff;

      --gold-500: #eab308;
      --gold-400: #facc15;
      --gold-300: #fde047;

      --slate-950: #020617;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;

      --bg-main: #f5f3ff;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;

      --shadow-sm: 0 2px 5px rgba(46, 16, 101, 0.04);
      --shadow-md: 0 8px 25px -4px rgba(46, 16, 101, 0.08);
      --shadow-lg: 0 16px 36px -6px rgba(46, 16, 101, 0.14);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--slate-900);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    /* Executive Top Navigation & Header */
    .pro-header {
      background: linear-gradient(135deg, #1e0938 0%, #2e1065 50%, #4c1d95 100%);
      color: white;
      padding: 1.6rem 1.5rem;
      border-bottom: 4px solid var(--gold-400);
      box-shadow: 0 8px 25px rgba(30, 9, 56, 0.4);
    }

    .pro-header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
    }

    .school-crest-img {
      height: 78px;
      width: auto;
      background: white;
      padding: 6px;
      border-radius: 14px;
      border: 2px solid var(--gold-400);
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    /* Status Bar Banner */
    .notice-banner {
      background-color: #ffffff;
      border-bottom: 1px solid var(--primary-100);
      padding: 0.8rem 1.5rem;
      font-size: 0.88rem;
      box-shadow: var(--shadow-sm);
    }

    .notice-banner-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Main Container */
    .app-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 5rem 1.25rem;
    }

    /* Navigation Bar */
    .pro-nav-bar {
      background: white;
      border-radius: var(--radius-md);
      border: 1px solid var(--primary-100);
      box-shadow: var(--shadow-md);
      padding: 0.5rem;
      margin-bottom: 2.25rem;
      display: flex;
      gap: 0.5rem;
    }

    .pro-nav-btn {
      flex: 1;
      padding: 0.9rem 1.2rem;
      border: none;
      background: transparent;
      color: var(--slate-700);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }

    .pro-nav-btn:hover {
      background-color: var(--primary-50);
      color: var(--primary-900);
    }

    .pro-nav-btn.active {
      background: linear-gradient(135deg, var(--primary-950) 0%, var(--primary-800) 100%);
      color: white;
      box-shadow: 0 6px 18px rgba(46, 16, 101, 0.25);
    }

    /* Cards */
    .pro-card {
      background: white;
      border-radius: var(--radius-md);
      border: 1px solid var(--primary-100);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .pro-card-header {
      background: linear-gradient(90deg, #1e0938 0%, #3b0764 100%);
      color: white;
      padding: 1.35rem 1.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3.5px solid var(--gold-400);
    }

    .pro-card-body {
      padding: 2.25rem;
    }

    /* Stat Box Cards */
    .pro-stat-box {
      background: white;
      border: 1px solid var(--primary-100);
      border-radius: var(--radius-md);
      padding: 1.5rem 1.75rem;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .pro-stat-box:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .pro-stat-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--primary-700);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-weight: 700;
      font-size: 0.94rem;
      color: var(--slate-800);
      margin-bottom: 0.5rem;
    }

    .form-label .required {
      color: #dc2626;
      margin-left: 3px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.85rem 1.15rem;
      border: 1.5px solid var(--slate-300);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--slate-900);
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary-600);
      box-shadow: 0 0 0 4px rgba(126, 34, 206, 0.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      font-weight: 700;
      font-size: 0.92rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-800) 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(46, 16, 101, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-950);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(46, 16, 101, 0.35);
    }

    .btn-secondary {
      background-color: var(--slate-100);
      color: var(--slate-800);
      border: 1px solid var(--slate-300);
    }

    .btn-secondary:hover {
      background-color: var(--slate-200);
    }

    .btn-success {
      background: #059669;
      color: white;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }

    .btn-success:hover {
      background: #047857;
    }

    .btn-outline {
      background-color: transparent;
      border: 1.5px solid var(--primary-300);
      color: #ffffff;
    }

    .btn-outline:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.38rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .badge-sulit {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .badge-gold {
      background-color: var(--gold-400);
      color: #422006;
    }

    .badge-purple {
      background-color: var(--primary-100);
      color: var(--primary-950);
      border: 1px solid var(--primary-200);
    }

    .badge-baharu {
      background-color: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .badge-proses {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .badge-selesai {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    /* Step Wizard */
    .wizard-steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .wizard-steps::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--slate-200);
      z-index: 0;
      transform: translateY(-50%);
    }

    .wizard-step {
      position: relative;
      z-index: 1;
      background-color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3.5px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--slate-600);
      font-size: 1rem;
    }

    .wizard-step.active {
      border-color: var(--primary-800);
      background: var(--primary-800);
      color: white;
      box-shadow: 0 0 0 5px rgba(88, 28, 135, 0.18);
    }

    .wizard-step.completed {
      border-color: #059669;
      background-color: #059669;
      color: white;
    }

    /* Print Styles matching IPGM 08 Template EXACTLY */
    @media print {
      body {
        background-color: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .app-container {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .print-template-paper {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        width: 100% !important;
      }
    }
  </style>
</head>

    // Storage Keys
    const STORAGE_KEY = 'ubk_tampasuk1_referrals_v12';
    const COUNSELOR_PIN_KEY = 'ubk_tampasuk1_counselor_pin';
    const CLOUD_SYNC_URL_KEY = 'ubk_tampasuk1_cloud_sync_url';

    const getStoredPin = () => localStorage.getItem(COUNSELOR_PIN_KEY) || '1234';
    const getCloudSyncUrl = () => localStorage.getItem(CLOUD_SYNC_URL_KEY) || '';

    const fetchCloudData = async (url) => {
      if (!url) return null;
      try {
        const res = await fetch(url, { method: 'GET' });
        if (!res.ok) return null;
        const json = await res.json();
        return Array.isArray(json) ? json : (json.referrals || null);
      } catch (e) {
        return null;
      }
    };

    const pushCloudData = async (url, dataArray) => {
      if (!url) return false;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataArray)
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    };

    // ZERO DUMMY DATA INITIALIZATION
    const getStoredReferrals = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
          return [];
        }
        return JSON.parse(raw);
      } catch (e) {
        return [];
      }
    };

    const saveReferralToStorage = (newReferral) => {
      const current = getStoredReferrals();
      const nextId = `RUJ-2026-${String(current.length + 1).padStart(3, '0')}`;
      const fullReferral = {
        ...newReferral,
        id: nextId,
        tarikh: newReferral.tarikh || new Date().toISOString().split('T')[0],
        status: 'BAHARU',
        ulasanKaunselor: '',
        tarikhSesi: '',
      };
      const updated = [fullReferral, ...current];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
      return fullReferral;
    };

    // Excel Export Helper using SheetJS
    const exportToExcelFile = (referralsList) => {
      if (!referralsList || referralsList.length === 0) {
        alert('Tiada rekod rujukan untuk dieksport.');
        return;
      }

      const rows = referralsList.map((item, idx) => {
        const cat = CATEGORIES_OF_ISSUES.find(c => c.id === item.kategoriIsu);
        const srv = SERVICE_TYPES.find(s => s.id === item.jenisPerkhidmatan);
        return {
          'BIL': idx + 1,
          'ID RUJUKAN': item.id,
          'TARIKH RUJUKAN': item.tarikh,
          'NAMA MURID': item.muridNama,
          'KELAS': item.muridKelas,
          'JANTINA': item.muridJantina,
          'NO. MYKAD': item.muridIc,
          'NAMA GURU PENGHANTAR': item.guruNama,
          'KATEGORI ISU': cat ? cat.label : item.kategoriIsu,
          'TAHAP KEUTAMAAN': item.tahapKeutamaan,
          'JENIS PERKHIDMATAN': srv ? srv.label : item.jenisPerkhidmatan,
          'ULASAN GURU PDP': item.ulasanPdP,
          'TINDAKAN AWAL GURU': item.tindakanGuru || '-',
          'STATUS KAUNSELING': item.status,
          'ULASAN KAUNSELOR': item.ulasanKaunselor || '-',
          'TARIKH SESI': item.tarikhSesi || '-'
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet['!cols'] = [
        { wch: 5 }, { wch: 15 }, { wch: 15 }, { wch: 35 }, { wch: 10 },
        { wch: 12 }, { wch: 18 }, { wch: 30 }, { wch: 28 }, { wch: 15 },
        { wch: 32 }, { wch: 45 }, { wch: 30 }, { wch: 15 }, { wch: 35 },
        { wch: 15 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Rekod Rujukan UBK');
      
      const fileName = `Rekod_Rujukan_UBK_SK_Tampasuk1_${new Date().toISOString().split('T')[0]}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    };

      const [sessionSubmittedIds, setSessionSubmittedIds] = useState([]);

      // REAL-TIME CLOUD & LOCAL STORAGE SYNC ENGINE (EVERY 4 SECONDS)
      useEffect(() => {
        const syncData = async () => {
          const cloudUrl = getCloudSyncUrl();
          setIsCloudConnected(!!cloudUrl);

          if (cloudUrl) {
            const cloudData = await fetchCloudData(cloudUrl);
            if (cloudData && Array.isArray(cloudData)) {
              setReferrals(cloudData);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
              return;
            }
          }

          const latest = getStoredReferrals();
          setReferrals(prev => {
            if (JSON.stringify(prev) !== JSON.stringify(latest)) {
              return latest;
            }
            return prev;
          });
        };

        syncData();
        const pollInterval = setInterval(syncData, 4000);

        const handleStorageChange = (e) => {
          if (e.key === STORAGE_KEY || !e.key) {
            setReferrals(getStoredReferrals());
          }
        };
        window.addEventListener('storage', handleStorageChange);

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          clearInterval(pollInterval);
        };
      }, []);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 4000);

          }
          return item;

    // --- FORM PAGE COMPONENT WITH SELECTION / CUSTOM INPUT ---
    function FormPage({ students, onSubmit }) {
      const [step, setStep] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);

      const [teacherSelectMode, setTeacherSelectMode] = useState('PRESET');
      const [studentSelectMode, setStudentSelectMode] = useState('PRESET');

      const [formData, setFormData] = useState({
        guruNama: '',
        tarikh: new Date().toISOString().split('T')[0],
        jenisPerkhidmatan: 'BIMBINGAN_INDIVIDU',
        muridId: '',
        muridNama: '',
        muridIc: '',
        muridKelas: '',
        muridJantina: 'LELAKI',
        kategoriIsu: 'AKADEMIK',
        tahapKeutamaan: 'SEDERHANA',
        ulasanPdP: '',
        tindakanGuru: '',
        pengesahan: true,
      });

      const handleTeacherSelect = (e) => {
        const val = e.target.value;
        if (val === 'CUSTOM') {
          setTeacherSelectMode('CUSTOM');
          setFormData(prev => ({ ...prev, guruNama: '' }));
        } else {
          setTeacherSelectMode('PRESET');
          setFormData(prev => ({ ...prev, guruNama: val }));
        }
      };

      const filteredStudents = students.filter(s => 
        s.nama.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.ic.includes(searchQuery) ||
        s.kelas.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const handleSelectStudent = (st) => {
        setStudentSelectMode('PRESET');
        setFormData(prev => ({
          ...prev,
          muridId: st.id,
          muridNama: st.nama,
          muridIc: st.ic,
          muridKelas: st.kelas,
          muridJantina: st.jantina || 'LELAKI',
        }));
        setSearchQuery(st.nama);
        setIsDropdownOpen(false);
      };

      const handleEnableCustomStudent = () => {
        setStudentSelectMode('CUSTOM');
        setFormData(prev => ({
          ...prev,
          muridId: 'STU-CUSTOM-' + Date.now().toString().slice(-4),
          muridNama: '',
          muridIc: '',
          muridKelas: '1A',
          muridJantina: 'LELAKI',
        }));
        setSearchQuery('');
        setIsDropdownOpen(false);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (step < 4) {
          if (step === 1 && !formData.guruNama) return alert('Sila pilih atau taip Nama Guru.');
          if (step === 2 && (!formData.muridNama || !formData.muridKelas)) return alert('Sila pilih atau taip Nama Murid dan Kelas.');
          if (step === 3 && (!formData.ulasanPdP || formData.ulasanPdP.trim().length < 5)) return alert('Sila isi ulasan sikap PdP murid.');

                </div>
              </div>
            </div>

    // --- STUDENT LIST PAGE COMPONENT (WITH IC MASKING FOR NON-COUNSELORS) ---
    function StudentListPage({ students, role, onSelectForReferral }) {
      const [search, setSearch] = useState('');
      const [selectedKelas, setSelectedKelas] = useState('ALL');

      const classList = Array.from(new Set(students.map(s => s.kelas))).sort();

      const filtered = students.filter(s => {
        const matchKelas = selectedKelas === 'ALL' || s.kelas === selectedKelas;
        const matchSearch = s.nama.toLowerCase().includes(search.toLowerCase()) || s.ic.includes(search) || s.kelas.toLowerCase().includes(search.toLowerCase());
        return matchKelas && matchSearch;
      });

      const formatIc = (ic) => {
        if (!ic) return '-';
        if (role === 'KAUNSELOR') return ic; // Unmasked for counselor
        if (ic.length >= 12) {
          return `${ic.substring(0, 6)}-${ic.substring(6, 8)}-****`; // Masked for privacy
        }
        return ic.substring(0, 4) + '****';
      };

      return (
        <div className="pro-card">
          <div className="pro-card-header">
            <h3 style={{ fontSize: '1.25rem', margin: 0, fontWeight: '800' }}>
              Direktori Murid SK Tampasuk 1 ({students.length} Murid)
            </h3>
          </div>

          <div className="pro-card-body">
            <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap', marginBottom: '1.5rem' }}>
              <input 
                type="text" 
                placeholder="Cari murid mengikut nama, MyKad, atau kelas..." 
                value={search} 
                onChange={e => setSearch(e.target.value)} 
                className="form-input" 
                style={{ flex: 2, minWidth: '220px' }}
              />

              <select 
                value={selectedKelas} 
                onChange={e => setSelectedKelas(e.target.value)}
                className="form-select"
                style={{ flex: 1, minWidth: '180px', fontWeight: '700' }}
              >
                <option value="ALL">Semua Kelas ({students.length} Murid)</option>
                {classList.map(k => (
                  <option key={k} value={k}>Kelas {k} ({students.filter(s => s.kelas === k).length} Murid)</option>
                ))}
              </select>
            </div>

            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.9rem' }}>
                <thead>
                  <tr style={{ backgroundColor: 'var(--slate-100)', color: 'var(--slate-900)', textAlign: 'left' }}>
                    <th style={{ padding: '0.85rem 1rem' }}>Bil</th>
                    <th style={{ padding: '0.85rem 1rem' }}>Nama Murid</th>
                    <th style={{ padding: '0.85rem 1rem' }}>No. Kad Pengenalan</th>
                    <th style={{ padding: '0.85rem 1rem' }}>Kelas</th>
                    <th style={{ padding: '0.85rem 1rem' }}>Jantina</th>
                    <th style={{ padding: '0.85rem 1rem', textAlign: 'center' }}>Tindakan</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((st, idx) => (
                    <tr key={st.id + st.nama} style={{ borderBottom: '1px solid var(--slate-200)' }}>
                      <td style={{ padding: '0.85rem 1rem' }}>{idx + 1}</td>
                      <td style={{ padding: '0.85rem 1rem', fontWeight: '700', color: 'var(--slate-900)' }}>{st.nama}</td>
                      <td style={{ padding: '0.85rem 1rem', fontFamily: 'monospace' }}>{formatIc(st.ic)}</td>
                      <td style={{ padding: '0.85rem 1rem' }}><span className="badge badge-purple">{st.kelas}</span></td>
                      <td style={{ padding: '0.85rem 1rem' }}>{st.jantina}</td>
                      <td style={{ padding: '0.85rem 1rem', textAlign: 'center' }}>
                        <button onClick={() => onSelectForReferral(st)} className="btn btn-primary" style={{ padding: '0.4rem 0.9rem', fontSize: '0.82rem' }}>
                          Buat Rujukan
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }
